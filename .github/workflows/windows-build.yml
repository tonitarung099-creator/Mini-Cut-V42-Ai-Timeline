name: Windows Baseline Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Static compile check
        run: python -m py_compile src/minicut_studio_agent.py src/minicut_mcp.py
      - name: Build desktop app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "MiniCut Studio Agent" --collect-all PySide6 --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets src/minicut_studio_agent.py
      - name: Build MCP companion
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --console --name "MiniCut MCP" --collect-all mcp src/minicut_mcp.py
      - uses: actions/upload-artifact@v4
        with:
          name: minicut-baseline-windows
          path: dist/
