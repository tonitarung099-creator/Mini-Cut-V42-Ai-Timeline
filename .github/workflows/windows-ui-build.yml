name: Windows Filmora UI Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/windows-ui-build.yml'

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Compile source
        run: python -m compileall -q src
      - name: Timeline model tests
        shell: pwsh
        run: |
          $env:PYTHONPATH="src"
          python -m unittest discover -s tests -v
      - name: UI offscreen smoke test
        shell: pwsh
        run: |
          $env:PYTHONPATH="src"
          $env:QT_QPA_PLATFORM="offscreen"
          python src/main.py --self-test
      - name: Build Windows desktop executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "MiniCut V42 AI Timeline" --paths src --collect-all PySide6 --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets src/main.py
      - name: Build MCP companion executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --console --name "MiniCut MCP" --paths src --collect-all mcp src/minicut_mcp.py
      - uses: actions/upload-artifact@v4
        with:
          name: minicut-v42-filmora-ui
          path: dist/
